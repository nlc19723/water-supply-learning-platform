<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0B5CAD">
<link rel="icon" type="image/png" href="favicon.png">
<title>术语解释 · 供水学习平台</title>
<style>
/* ================================================================
   术语解释 · 视觉系统（沿用平台纯蓝主题令牌，与口径计算器/行话/法兰一致）
   ================================================================ */
:root{
  --brand:#0B5CAD; --brand-deep:#084A8A; --accent:#2E7BD6; --accent-soft:#E7F0FC;
  --paper:#F1F4F9; --surface:#FFFFFF; --raised:#E6EDF7; --sunken:#EDF3FB;
  --ink:#1E293B; --ink-2:#475569; --ink-3:#58697D;
  --line:#E2E8F0; --hair:#EEF2F7;
  --ok:#15803D; --warn:#B45309; --err:#DC2626;
  --gold-bg:#FDF6EC; --gold-line:#F0E0C6;
  --err-bg:#FDECEC; --ok-bg:#EAF6EE;
  --r-xs:6px; --r-sm:10px; --r-md:14px; --r-lg:20px;
  --sh-1:0 1px 2px rgba(16,32,58,.05),0 2px 6px rgba(16,32,58,.04),inset 0 1px 0 rgba(255,255,255,.7);
  --sh-2:0 2px 4px rgba(16,32,58,.06),0 8px 18px rgba(16,32,58,.08),inset 0 1px 0 rgba(255,255,255,.75);
  --sh-3:0 4px 8px rgba(16,32,58,.08),0 16px 36px rgba(16,32,58,.12),inset 0 1px 0 rgba(255,255,255,.8);
  --ease:cubic-bezier(.4,0,.2,1);
  --fs-cap:12px; --fs-body:14px; --fs-sub:16px; --fs-title:18px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
html{background:var(--paper)}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  color:var(--ink);background:var(--paper);line-height:1.5;font-size:var(--fs-body);
  font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;
  padding:0 0 env(safe-area-inset-bottom)}

.wrap{max-width:840px;margin:0 auto;padding:20px 16px 40px}

/* 头部 */
.app-head{display:flex;align-items:center;gap:12px;padding:6px 2px 18px}
.app-logo{width:44px;height:44px;border-radius:13px;flex:0 0 auto;display:grid;place-items:center;
  background:linear-gradient(145deg,var(--accent),var(--brand-deep));color:#fff;box-shadow:var(--sh-2)}
.app-logo svg{width:26px;height:26px}
.app-title{font-size:20px;font-weight:800;letter-spacing:.5px}
.app-sub{font-size:12px;color:var(--ink-3);margin-top:2px}
.ver-badge{margin-left:auto;font-size:11px;color:var(--ink-3);background:var(--surface);
  border:1px solid var(--line);border-radius:20px;padding:5px 11px;white-space:nowrap;box-shadow:var(--sh-1)}

/* 搜索 */
.search-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);
  padding:16px;box-shadow:var(--sh-2);position:sticky;top:0;z-index:20}
.search-row{display:flex;align-items:center;gap:10px;background:var(--sunken);
  border:1.5px solid transparent;border-radius:var(--r-md);padding:0 14px;height:50px;transition:.2s var(--ease)}
.search-row:focus-within{border-color:var(--accent);background:var(--surface);box-shadow:0 0 0 4px var(--accent-soft)}
.search-row svg{width:20px;height:20px;color:var(--brand);flex:0 0 auto}
#sInput{flex:1;min-width:0;border:0;background:transparent;outline:0;font-size:16px;color:var(--ink)}
#sInput::placeholder{color:var(--ink-3)}
#sInput::-webkit-search-cancel-button,#sInput::-webkit-search-decoration{-webkit-appearance:none;appearance:none;display:none}
.clear-btn{border:0;background:var(--raised);color:var(--ink-2);border-radius:50%;
  width:26px;height:26px;flex:0 0 auto;cursor:pointer;display:grid;place-items:center;font-size:15px}
.hot-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;align-items:center}
.hot-label{font-size:12px;color:var(--ink-3)}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--ink-2);
  border-radius:20px;padding:6px 13px;font-size:13px;cursor:pointer;transition:.15s var(--ease);white-space:nowrap}
.chip:hover{border-color:var(--accent);color:var(--brand);background:var(--accent-soft)}
.chip:active{transform:scale(.96)}
.chip.on{background:var(--brand);color:#fff;border-color:var(--brand)}

/* 分类筛选条 */
.cat-bar{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px;padding-top:12px;border-top:1px dashed var(--line)}
.cat-bar .chip{padding:5px 11px;font-size:12px}

/* 统计 */
.result-meta{display:flex;align-items:center;gap:8px;padding:20px 4px 12px;font-size:13px;color:var(--ink-3)}
.result-meta b{color:var(--brand);font-size:15px}
.meta-line{flex:1;height:1px;background:var(--line)}

/* 易混对照卡 */
.confuse-card{background:linear-gradient(160deg,#FFFBF3,var(--gold-bg));border:1.5px solid var(--gold-line);
  border-radius:var(--r-md);padding:16px;margin-bottom:18px;box-shadow:var(--sh-1)}
.confuse-title{display:flex;align-items:center;gap:8px;font-weight:800;color:var(--warn);font-size:14px;margin-bottom:12px}
.confuse-title svg{width:18px;height:18px}
.confuse-grid{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center}
.confuse-side{background:var(--surface);border:1px solid var(--gold-line);border-radius:var(--r-sm);padding:12px;text-align:center}
.confuse-side .nm{font-weight:800;color:var(--ink);font-size:15px}
.confuse-side .fn{font-size:12px;color:var(--ink-2);margin-top:4px}
.confuse-vs{font-size:12px;font-weight:800;color:var(--err);background:var(--err-bg);
  border-radius:20px;padding:4px 8px;white-space:nowrap}
.confuse-warn{margin-top:12px;font-size:13px;color:#7c2d12;line-height:1.6;
  border-top:1px dashed var(--gold-line);padding-top:10px}

/* 词条卡 */
.entry{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);
  padding:18px;margin-bottom:12px;box-shadow:var(--sh-1);transition:box-shadow .2s var(--ease)}
.entry:hover{box-shadow:var(--sh-2)}
.entry.focus-hit{animation:focusPulse 1.8s var(--ease);border-color:var(--accent)}
@keyframes focusPulse{
  0%{box-shadow:0 0 0 0 rgba(46,123,214,.55),var(--sh-2);background:var(--accent-soft)}
  45%{box-shadow:0 0 0 7px rgba(46,123,214,0),var(--sh-2);background:var(--accent-soft)}
  100%{box-shadow:var(--sh-1);background:var(--surface)}
}
@media(prefers-reduced-motion:reduce){.entry.focus-hit{animation:none;background:var(--accent-soft);box-shadow:0 0 0 2px var(--accent)}}
.entry-top{display:flex;align-items:flex-start;gap:10px;flex-wrap:wrap}
.cat-tag{font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px;white-space:nowrap;flex:0 0 auto;
  background:var(--accent-soft);color:var(--brand)}
.cat-tag[data-c="缩写代号"]{background:#E7F0FC;color:#0B5CAD}
.cat-tag[data-c="标准体系"]{background:#EDE9FE;color:#6D28D9}
.cat-tag[data-c="平台功能"]{background:#DCFCE7;color:#15803D}
.lv-tag{font-size:10px;color:var(--ink-3);border:1px solid var(--line);border-radius:6px;padding:1px 6px;flex:0 0 auto}
.t-name{font-size:18px;font-weight:800;color:var(--ink);flex:1;min-width:0}
.t-en{font-size:12.5px;color:var(--brand);font-style:italic;margin-top:6px;font-weight:600}

/* 术语字段行 */
.field{display:flex;gap:10px;margin-top:12px;align-items:flex-start}
.field-k{font-size:11px;font-weight:700;color:var(--ink-3);flex:0 0 62px;
  padding-top:2px;letter-spacing:.5px}
.field-v{font-size:13.5px;color:var(--ink-2);line-height:1.7;flex:1;min-width:0}
.field.origin .field-v{color:#7c2d12}
.field.def .field-v{color:var(--ink)}
.field.plain .field-v{color:var(--ink-2)}
.std-line{display:inline-block;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px;
  background:var(--raised);color:var(--brand-deep);border-radius:5px;padding:2px 7px;margin:0 4px 4px 0}

.entry-foot{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap;align-items:center;
  padding-top:12px;border-top:1px dashed var(--line)}
.mini-btn{border:1px solid var(--line);background:var(--surface);color:var(--ink-2);border-radius:8px;
  padding:6px 12px;font-size:12px;cursor:pointer;display:inline-flex;align-items:center;gap:5px;transition:.15s var(--ease)}
.mini-btn:hover{border-color:var(--accent);color:var(--brand)}
.mini-btn:active{transform:scale(.96)}
.mini-btn svg{width:14px;height:14px}
.mini-btn.primary{background:var(--brand);color:#fff;border-color:var(--brand)}
.mini-btn.primary:hover{background:var(--brand-deep);color:#fff}
.star.on{color:var(--warn);border-color:var(--warn)}
.hl{background:#FFF2B8;color:inherit;border-radius:3px;padding:0 1px}

/* 空态 */
.empty{text-align:center;padding:50px 20px;color:var(--ink-3)}
.empty svg{width:52px;height:52px;color:var(--line);margin-bottom:14px}
.empty p{font-size:15px;margin-bottom:16px}
.empty .chip{margin:3px}

/* 分类浏览标题 */
.browse-head{font-size:13px;font-weight:700;color:var(--ink-2);padding:18px 4px 6px;display:flex;align-items:center;gap:8px}
.browse-head .bh-count{font-size:11px;color:var(--ink-3);font-weight:400}

/* 页脚 */
.foot-note{margin-top:24px;padding:14px 16px;background:var(--surface);border:1px solid var(--line);
  border-radius:var(--r-md);font-size:12px;color:var(--ink-3);line-height:1.7}
.foot-note b{color:var(--ink-2)}

/* Toast */
.toast{position:fixed;left:50%;bottom:32px;transform:translateX(-50%) translateY(20px);
  background:#1E293B;color:#fff;padding:11px 22px;border-radius:24px;font-size:14px;
  box-shadow:var(--sh-3);opacity:0;pointer-events:none;transition:.25s var(--ease);z-index:99;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* 移动端：搜索区取消吸顶，随内容滚走，避免下滑时一大块搜索框遮挡词条正文 */
@media(max-width:640px){
  .search-card{position:static;top:auto;z-index:auto}
}
@media(max-width:480px){
  .wrap{padding:14px 12px 32px}
  .app-title{font-size:18px}
  .ver-badge{display:none}
  .search-card{padding:13px}
  .confuse-grid{grid-template-columns:1fr;gap:7px}
  .confuse-vs{justify-self:center}
  .t-name{font-size:16px}
  .field{flex-direction:column;gap:2px}
  .field-k{flex:none}
}
@media(prefers-color-scheme:dark){
  :root{--paper:#0F1623;--surface:#16202F;--raised:#1E2A3B;--sunken:#121B29;
    --ink:#E6EDF6;--ink-2:#B4C1D2;--ink-3:#8695AA;--line:#263349;--hair:#1F2A3B;
    --accent-soft:#16304F;--gold-bg:#2A2216;--gold-line:#4A3B22}
  .confuse-card{background:linear-gradient(160deg,#2A2216,var(--gold-bg))}
  .confuse-warn{color:#F0C987}
  .confuse-side{background:var(--surface)}
  .field.origin .field-v{color:#F0C987}
  .cat-tag[data-c="缩写代号"]{background:#16304F;color:#8FC0F5}
  .hl{background:#5A4E1E;color:#FFF}
}
@media print{
  .search-card,.clear-btn,#emptyState,.mini-btn,.toast,.ver-badge,.cat-bar{display:none!important}
  body{background:#fff!important;color:#000!important}
  .wrap{max-width:none;padding:0}
  .entry,.confuse-card,.foot-note{box-shadow:none;border:1px solid #ccc;break-inside:avoid}
  .confuse-card{background:#fff!important}
  .confuse-warn{color:#7c2d12!important}
  .field.origin .field-v{color:#7c2d12!important}
  .cat-tag,.lv-tag{border:1px solid #999}
}

/* ===== v2.26.63 全面禁止移动端聚焦输入自动放大页面 =====
   iOS Safari 规则：input/textarea/select 的 computed font-size < 16px 时，
   聚焦会自动放大整页且卸载后不还原。所有可输入控件在移动端钳到 16px。 */
@media (max-width: 768px){
  input,textarea,select{font-size:16px!important}
}
</style>
</head>
<body>
<main class="wrap">
  <header class="app-head">
    <div class="app-logo" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v16H6.5A2.5 2.5 0 0 0 4 21.5z"/>
        <path d="M4 5.5v16A2.5 2.5 0 0 1 6.5 19H20"/>
        <path d="M8 8h8M8 11.5h6"/>
      </svg>
    </div>
    <div>
      <h1 class="app-title">术语解释</h1>
      <div class="app-sub">术语来源 · 标准定义 · 通俗解释 · 一线速查</div>
    </div>
    <span class="ver-badge" id="verBadge">数据 v—</span>
  </header>

  <div class="search-card">
    <div class="search-row">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="10.8" cy="10.8" r="6.8"/><path d="M20 20l-4.2-4.2"/></svg>
      <input id="sInput" type="search" autocomplete="off" placeholder="输入术语、缩写或英文，如：应力 / 圆度 / 干膜 / SDR" aria-label="搜索术语">
      <button class="clear-btn" id="clearBtn" aria-label="清空" hidden>✕</button>
    </div>
    <div class="hot-row" id="hotRow">
      <span class="hot-label">热门：</span>
    </div>
    <div class="cat-bar" id="catBar"></div>
  </div>

  <div class="result-meta" id="meta" hidden>
    <span>找到 <b id="cnt">0</b> 条术语</span>
    <span class="meta-line"></span>
  </div>
  <div id="confuseZone"></div>
  <div id="results"></div>
  <div class="empty" id="emptyState" hidden>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><circle cx="10.8" cy="10.8" r="6.8"/><path d="M20 20l-4.2-4.2"/></svg>
    <p>没找到这条术语。试试这些常见词：</p>
    <div id="emptyChips"></div>
  </div>

  <div class="foot-note">
    <b>数据说明：</b>术语来源与标准定义依据现行标准（GB/T 1182、GB/T 13663、GB/T 9124.1-2019、ISO 12944 等）与权威资料交叉核准；通俗解释按「是什么→原理→有什么用→不达标后果」组织，为一线白话，仅作理解辅助。<br>
    <b>免责：</b><span id="statusText"></span>。工程应用<b>以标准文本、设计文件与材料实物为准</b>。<br>
    <b>全局生效：</b>本词库为唯一数据源——课程正文、材料卡完整说明中的可点虚线术语，均出自本表；点开即见释义，可回到此页看完整词条。
  </div>
</main>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="./static/term-data.js"></script>
<script>
(function(){
  "use strict";
  var D=window.TERM_DICT;
  if(!D){document.getElementById("results").innerHTML='<div class="empty">数据文件未加载，请检查网络后重试。</div>';return;}
  document.getElementById("verBadge").textContent="数据 v"+D.version;
  document.getElementById("statusText").textContent=D.status;
  var norm=D.norm;
  var HOT=["应力","圆度","水锤","干膜","SDR","公差"];
  var byId={};D.entries.forEach(function(e){byId[e.id]=e;});
  var favorites=loadLS("term_fav",[]);
  var toastTimer=null;
  var activeCat="全部";

  function loadLS(k,d){try{var v=JSON.parse(localStorage.getItem(k));return Array.isArray(v)?v:d;}catch(e){return d;}}
  function saveLS(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
  function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
  function hl(text,q){
    var t=String(text);if(!q)return esc(t);
    var nq=norm(q);if(!nq)return esc(t);
    var lt=t.toLowerCase();
    var map=[];for(var i=0;i<lt.length;i++){if(!/\s/.test(lt[i]))map.push(i);}
    var tl=map.map(function(idx){return lt[idx];}).join("");
    var at=tl.indexOf(nq);
    if(at<0||at>=map.length)return esc(t);
    var start=map[at];
    var lastAt=at+nq.length-1;
    var end=(lastAt<map.length?map[lastAt]:t.length-1)+1;
    return esc(t.slice(0,start))+'<mark class="hl">'+esc(t.slice(start,end))+'</mark>'+esc(t.slice(end));
  }
  function toast(msg){
    var el=document.getElementById("toast");el.textContent=msg;el.classList.add("show");
    clearTimeout(toastTimer);toastTimer=setTimeout(function(){el.classList.remove("show");},1800);
  }
  function matchEntry(e,q){
    if(!q)return true;
    var hay=[e.t,e.en,e.origin,e.def,e.plain,e.std,e.cat].concat(e.aliases||[]).map(norm).join("|");
    return hay.indexOf(norm(q))>=0;
  }

  /* 热门词 */
  var hotRow=document.getElementById("hotRow");
  HOT.forEach(function(w){var b=document.createElement("button");b.type="button";b.className="chip";b.textContent=w;
    b.addEventListener("click",function(){input.value=w;onInput();});hotRow.appendChild(b);});

  /* 分类筛选条 */
  var catBar=document.getElementById("catBar");
  function buildCatBar(){
    catBar.innerHTML="";
    ["全部"].concat(D.cats).forEach(function(c){
      var n=c==="全部"?D.entries.length:D.entries.filter(function(e){return e.cat===c;}).length;
      var b=document.createElement("button");b.type="button";b.className="chip"+(activeCat===c?" on":"");
      b.textContent=c+" ("+n+")";b.setAttribute("aria-pressed",activeCat===c?"true":"false");
      b.addEventListener("click",function(){activeCat=c;input.value="";buildCatBar();onInput();});
      catBar.appendChild(b);
    });
  }

  var input=document.getElementById("sInput");
  var clearBtn=document.getElementById("clearBtn");
  var results=document.getElementById("results");
  var emptyState=document.getElementById("emptyState");
  var meta=document.getElementById("meta");
  var confuseZone=document.getElementById("confuseZone");

  function onInput(){
    var q=input.value.trim();
    clearBtn.hidden=!q;
    if(q) activeCat="全部";
    render(q);
  }
  input.addEventListener("input",onInput);
  input.addEventListener("keydown",function(e){if(e.key==="Escape"){input.value="";onInput();}});
  clearBtn.addEventListener("click",function(){input.value="";onInput();input.focus();});

  function renderHotEmptyChips(){
    var box=document.getElementById("emptyChips");box.innerHTML="";
    HOT.forEach(function(w){var b=document.createElement("button");b.type="button";b.className="chip";b.textContent=w;
      b.addEventListener("click",function(){input.value=w;onInput();});box.appendChild(b);});
  }

  function renderConfuse(matchedIds,q){
    confuseZone.innerHTML="";
    var shown={};
    D.confuseGroups.forEach(function(g){
      var isHit=g.ids.some(function(id){return matchedIds.indexOf(id)>=0;});
      if(!isHit)return;
      var key=g.ids.join("_");if(shown[key])return;shown[key]=1;
      var a=byId[g.ids[0]],b=byId[g.ids[1]];if(!a||!b)return;
      var div=document.createElement("div");div.className="confuse-card";
      div.innerHTML=
        '<div class="confuse-title"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.2 21.2 20H2.8z"/><path d="M12 9.5v4.8M12 17.3h.01"/></svg>'+esc(g.title)+'</div>'+
        '<div class="confuse-grid">'+
          '<div class="confuse-side"><div class="nm">'+esc(a.t)+'</div><div class="fn">'+esc(a.en)+'</div></div>'+
          '<div class="confuse-vs">≠ 易混</div>'+
          '<div class="confuse-side"><div class="nm">'+esc(b.t)+'</div><div class="fn">'+esc(b.en)+'</div></div>'+
        '</div>'+
        '<div class="confuse-warn">'+esc(g.warning)+'</div>';
      confuseZone.appendChild(div);
    });
  }

  function fieldRow(k,v,cls,q){
    if(!v)return "";
    return '<div class="field '+(cls||"")+'"><span class="field-k">'+k+'</span><span class="field-v">'+hl(v,q)+'</span></div>';
  }
  function entryHtml(e,q){
    var fav=favorites.indexOf(e.id)>=0;
    var stdHtml="";
    if(e.std){
      stdHtml='<div class="field"><span class="field-k">关联标准</span><span class="field-v">'+
        e.std.split(/[；;]/).filter(Boolean).map(function(s){return '<span class="std-line">'+esc(s.trim())+'</span>';}).join("")+'</span></div>';
    }
    var h='<article class="entry" data-id="'+esc(e.id)+'">';
    h+='<div class="entry-top">'+
       '<span class="cat-tag" data-c="'+esc(e.cat)+'">'+esc(e.cat)+'</span>'+
       '<span class="lv-tag">'+e.level+' 级</span>'+
       '<span class="t-name">'+hl(e.t,q)+'</span></div>';
    if(e.en) h+='<div class="t-en">'+hl(e.en,q)+'</div>';
    h+=fieldRow("术语来源",e.origin,"origin",q);
    h+=fieldRow("规范定义",e.def,"def",q);
    h+=fieldRow("通俗解释",e.plain,"plain",q);
    h+=stdHtml;
    if(e.aliases&&e.aliases.length) h+=fieldRow("别称/命中",e.aliases.join(" · "),"",q);
    h+='<div class="entry-foot">';
    h+='<button type="button" class="mini-btn" data-act="copy" data-text="'+esc(e.t)+'">'+
       '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/></svg>复制术语</button>';
    if(e.matKw){
      h+='<button type="button" class="mini-btn primary" data-act="mat" data-kw="'+esc(e.matKw)+'">'+
         '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M4 12h16M4 18h10"/></svg>查材料卡</button>';
    }
    h+='<button type="button" class="mini-btn star'+(fav?" on":"")+'" data-act="fav" data-id="'+esc(e.id)+'" aria-label="收藏">'+(fav?"★ 已收藏":"☆ 收藏")+'</button>';
    h+='</div></article>';
    return h;
  }

  function render(q){
    var list=D.entries.filter(function(e){
      var okQ=matchEntry(e,q);
      var okC=!q&&activeCat!=="全部"?e.cat===activeCat:true;
      return okQ&&okC;
    });
    results.innerHTML="";confuseZone.innerHTML="";
    if(!list.length){
      meta.hidden=true;emptyState.hidden=false;renderHotEmptyChips();buildCatBar();return;
    }
    emptyState.hidden=true;meta.hidden=false;buildCatBar();
    document.getElementById("cnt").textContent=list.length;
    var matchedIds=list.map(function(e){return e.id;});
    renderConfuse(matchedIds,q);
    if(!q&&activeCat==="全部"){
      D.cats.forEach(function(c){
        var grp=list.filter(function(e){return e.cat===c;});if(!grp.length)return;
        var hd=document.createElement("h2");hd.className="browse-head";
        hd.innerHTML='▍'+esc(c)+' <span class="bh-count">'+grp.length+' 条</span>';
        results.appendChild(hd);
        grp.forEach(function(e){results.insertAdjacentHTML("beforeend",entryHtml(e,q));});
      });
    }else{
      list.forEach(function(e){results.insertAdjacentHTML("beforeend",entryHtml(e,q));});
    }
  }

  results.addEventListener("click",function(ev){
    var b=ev.target.closest("[data-act]");if(!b)return;
    var act=b.dataset.act;
    if(act==="copy"){
      var txt=b.dataset.text||"";
      if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(function(){toast("已复制：" + txt);}).catch(function(){fallbackCopy(txt);});}
      else fallbackCopy(txt);
    }else if(act==="fav"){
      var id=b.dataset.id,i=favorites.indexOf(id);
      if(i>=0){favorites.splice(i,1);b.classList.remove("on");b.textContent="☆ 收藏";toast("已取消收藏");}
      else{favorites.push(id);b.classList.add("on");b.textContent="★ 已收藏";toast("已收藏");}
      saveLS("term_fav",favorites);
    }else if(act==="mat"){
      var kw=b.dataset.kw;
      try{window.parent.postMessage({type:"TERM_TO_MAT",kw:kw},"*");}catch(e){}
      toast("正在跳转到材料卡…");
    }
  });
  function fallbackCopy(txt){
    var ta=document.createElement("textarea");ta.value=txt;ta.style.position="fixed";ta.style.opacity="0";
    document.body.appendChild(ta);ta.select();try{document.execCommand("copy");toast("已复制");}catch(e){toast("复制失败，请手动选择");}
    document.body.removeChild(ta);
  }

  /* 从课程正文/材料卡气泡「完整词条 →」定位：父页 postMessage TERM_FOCUS。
     清筛选→重渲染→滚动居中→高亮脉冲→焦点可达（A11y：读屏能读到定位结果）。 */
  function focusTerm(tid){
    tid=String(tid||"");
    var target=byId[tid];
    if(!target){toast("暂未收录该词条，已显示全部术语");render("");return;}
    input.value="";clearBtn.hidden=true;activeCat="全部";   /* 保证目标一定在列表里 */
    render("");
    var node=null;
    var all=results.querySelectorAll(".entry");
    for(var i=0;i<all.length;i++){if(all[i].getAttribute("data-id")===tid){node=all[i];break;}}
    if(!node){toast("已定位到术语页，请手动查找");return;}
    node.scrollIntoView({behavior:"smooth",block:"center"});
    node.classList.remove("focus-hit");
    void node.offsetWidth;                                    /* 强制重排，保证连续定位能重放动画 */
    node.classList.add("focus-hit");
    var nameEl=node.querySelector(".t-name");
    if(nameEl){if(!nameEl.hasAttribute("tabindex"))nameEl.setAttribute("tabindex","-1");
      try{nameEl.focus({preventScroll:true});}catch(e){}}
    toast("已定位："+target.t.split(" · ")[0]);
  }
  window.addEventListener("message",function(ev){
    if(!ev||!ev.data||ev.data.type!=="TERM_FOCUS")return;
    focusTerm(ev.data.tid);
  });

  render("");
})();
</script>
<script>
/* 移动端手势锁定：与宿主平台同款口径——禁 iOS 捏合/双击缩放、多指手势、横滑返回；
   保留单指纵向滚动、点击、输入；放行表格/分类条等真实横向滚动容器，避免误伤功能。
   桌面浏览器不响应 touch/gesture 事件，Ctrl+/- 缩放不受影响。 */
(function(){
  "use strict";
  ["gesturestart","gesturechange","gestureend"].forEach(function(t){
    document.addEventListener(t,function(e){e.preventDefault();},{passive:false});
  });
  /* 多指触控一律拦截（缩放/多指手势） */
  document.addEventListener("touchmove",function(e){
    if(e.touches&&e.touches.length>1&&e.cancelable) e.preventDefault();
  },{passive:false});
  /* 从触点向上找可横向滚动祖先：放行真实横向滚动容器 */
  function scrollableX(el){
    while(el&&el.nodeType===1){
      var cs=getComputedStyle(el);
      if((cs.overflowX==="auto"||cs.overflowX==="scroll")&&el.scrollWidth>el.clientWidth+1) return true;
      if(el===document.documentElement) break;
      el=el.parentElement;
    }
    return false;
  }
  var sx=0,sy=0;
  document.addEventListener("touchstart",function(e){
    if(!e.touches||e.touches.length!==1) return;
    sx=e.touches[0].clientX; sy=e.touches[0].clientY;
  },{passive:true});
  document.addEventListener("touchmove",function(e){
    if(!e.touches||e.touches.length!==1||!e.cancelable) return;
    if(scrollableX(e.target)) return;   /* 表格/分类条等横向滚动放行 */
    var dx=e.touches[0].clientX-sx, dy=e.touches[0].clientY-sy;
    if(Math.abs(dx)>8&&Math.abs(dx)>Math.abs(dy)) e.preventDefault();
  },{passive:false});
})();
</script>
